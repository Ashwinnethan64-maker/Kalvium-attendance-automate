<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalvium Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-logo">K</div>
        <div class="brand-info">
          <h1>KALVIUM ASSISTANT</h1>
          <span class="version">v1.0 • Manifest V3</span>
        </div>
      </div>
      <div id="status-badge" class="badge badge-active">ACTIVE</div>
    </header>

    <!-- Current Session Card -->
    <section class="card session-card">
      <div class="card-header">
        <span class="card-title">CURRENT SESSION</span>
        <span id="session-time" class="session-time-pill">--:--</span>
      </div>
      <div id="session-name" class="session-name">Detecting session...</div>
      
      <div class="meta-grid">
        <div class="meta-item">
          <span class="meta-label">Attendance</span>
          <span id="attendance-status" class="meta-val val-unknown">UNKNOWN</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Camera</span>
          <span id="camera-status" class="meta-val val-unknown">UNKNOWN</span>
        </div>
      </div>

      <div id="state-detail" class="state-detail">
        Scanning active Kalvium dashboard...
      </div>
    </section>

    <!-- Today's Schedule -->
    <section class="schedule-section">
      <div class="section-title">Today's Sessions</div>
      <div id="sessions-list" class="sessions-list">
        <div class="empty-state">No scheduled sessions loaded</div>
      </div>
    </section>

    <!-- Controls -->
    <footer class="controls">
      <button id="btn-open-dashboard" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        Open Dashboard
      </button>
      <button id="btn-toggle-monitor" class="btn btn-secondary">
        Pause Monitoring
      </button>
      <button id="btn-settings" class="btn btn-icon" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </footer>
  </div>

  <script src="../shared/constants.js"></script>
  <script src="../shared/state.js"></script>
  <script src="popup.js"></script>
</body>
</html>
