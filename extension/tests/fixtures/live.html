<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kalvium Dashboard - Live Attendance</title>
</head>
<body>
  <div id="root">
    <div class="dashboard-container">
      <h2>My Day</h2>
      <div class="grid grid-cols-1 gap-4">
        <!-- Live session card with Mark Attendance -->
        <div class="card rounded-lg border p-4">
          <div class="font-bold text-lg">Operating Systems & Kernels</div>
          <div class="text-sm text-gray-500">9:55 AM - 10:50 AM</div>
          <span class="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded">Happening Now</span>
          <span class="inline-block bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">Attendance is live</span>
          
          <div class="mt-4">
            <button class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded">
              Mark Attendance
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
